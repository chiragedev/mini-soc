<!--
  Mini SOC — Wazuh Agent Configuration
  Enhanced configuration for Windows endpoint monitoring
  
  This config is deployed to: C:\Program Files (x86)\ossec-agent\ossec.conf
-->
<ossec_config>

  <client>
    <server>
      <address>localhost</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- ================================================
       Log Collection — Windows Event Channels
       ================================================ -->
  
  <!-- Security Events (Logon, Privilege Use, etc.) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4634 or EventID=4648 or EventID=4672 or EventID=4688 or EventID=4697 or EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4728 or EventID=4732 or EventID=4756 or EventID=1102]</query>
  </localfile>

  <!-- System Events -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=7045 or EventID=7040 or EventID=7036]</query>
  </localfile>

  <!-- Sysmon Events (Process, Network, Registry, File) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Events -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4103 or EventID=4104]</query>
  </localfile>

  <!-- Windows Defender Events -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ================================================
       File Integrity Monitoring (FIM)
       ================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    
    <!-- Monitor critical system directories -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\config</directories>
    
    <!-- Monitor startup locations -->
    <directories check_all="yes" realtime="yes">%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    
    <!-- Monitor scheduled tasks -->
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>
    
    <!-- Ignore noise -->
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore>C:\Windows\Temp</ignore>
  </syscheck>

  <!-- ================================================
       Active Response
       ================================================ -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

  <!-- ================================================
       Rootcheck
       ================================================ -->
  <rootcheck>
    <disabled>no</disabled>
    <windows_audit>./shared/win_audit_rcl.txt</windows_audit>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>

  <!-- ================================================
       Vulnerability Detection
       ================================================ -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

</ossec_config>
